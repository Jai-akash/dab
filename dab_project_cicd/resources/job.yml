
resources:
  jobs:
    orders_medallion_job:
      name: "[${bundle.target}] Orders Medallion ETL"

      max_concurrent_runs: 1

      tasks:

        - task_key: bronze_autoloader_ingestion
          notebook_task:
            notebook_path: ../src/bronze_injection.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_autoloader_ingestion

          notebook_task:
            notebook_path: ../src/silver_trans.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_cleaning

          notebook_task:
            notebook_path: ../src/gold_agg.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
